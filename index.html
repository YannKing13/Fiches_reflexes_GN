function chooseView(m){viewMode=m;render()}
function setAnswer(fid,i,v){if(!answers[fid])answers[fid]={};answers[fid][i]=v;save('rgn_answers',answers);render()}
function moveGuide(fid,d){let f=[...seed,...custom].find(x=>x.id===fid);guidePos[fid]=Math.max(0,Math.min((f.questions||[]).length-1,(guidePos[fid]||0)+d));save('rgn_guidepos',guidePos);render()}
function guidanceFor(f,i){let a=guidance[f.id]?.[i];if(a)return a;return [f.questions[i], 'Documenter les éléments positifs, apprécier les risques et vérifier les règles spécifiques avec l’OPJ.', 'Consigner les éléments négatifs et poursuivre les autres vérifications sans conclure automatiquement.', 'Identifier les informations manquantes et consulter l’OPJ si nécessaire.']}
function questionHTML(f,i){let g=guidanceFor(f,i),v=answers[f.id]?.[i];return `<div class="decision"><div class="qnum">QUESTION ${i+1} / ${f.questions.length}</div><b>${esc(g[0])}</b><div class="choices">${[['oui','Oui'],['non','Non'],['inconnu','Inconnu']].map(([k,l])=>`<button class="${v===k?'selected':''}" onclick="setAnswer('${f.id}',${i},'${k}')">${l}</button>`).join('')}</div>${v?`<div class="advice"><strong>Point d’attention :</strong><p>${esc(g[v==='oui'?1:v==='non'?2:3])}</p></div>`:''}</div>`}
function render(){if(page!=='detail'){renderV2();return}let f=[...seed,...custom].find(x=>x.id===current);if(!f){page='catalogue';renderV2();return}let a=$('app'),checked=checks[f.id]||[],qs=f.questions||[],pos=Math.min(guidePos[f.id]||0,Math.max(0,qs.length-1));a.innerHTML=`<button class="back" onclick="page='catalogue';render()">← Toutes les fiches</button><div class="card detail"><div class="muted">${esc(f.type)}</div><h2>${esc(f.title)}</h2><div class="switch"><button class="${viewMode==='fiche'?'selected':''}" onclick="chooseView('fiche')">☷ Fiche complète</button><button class="${viewMode==='guide'?'selected':''}" onclick="chooseView('guide')">◇ Assistant guidé</button></div><p class="muted">Aide-mémoire indicatif non officiel. Vérifier les textes, habilitations, instructions applicables et décisions de l’autorité compétente.</p>${viewMode==='fiche'?`<h3>Actions / checklist</h3><div class="progress">${checked.length} / ${f.steps.length} étapes cochées</div>${f.steps.map((step,i)=>`<label class="step"><input type="checkbox" ${checked.includes(i)?'checked':''} onchange="toggle('${f.id}',${i},this.checked);render()"> <span>${esc(step)}</span></label>`).join('')}<h3>Questions de vérification</h3>${qs.length?qs.map((q,i)=>questionHTML(f,i)).join(''):'<p>Aucun questionnaire disponible pour cette fiche.</p>'}`:`<h3>Parcours guidé</h3>${qs.length?`${questionHTML(f,pos)}<div class="guideNav"><button ${pos===0?'disabled':''} onclick="moveGuide('${f.id}',-1)">← Précédent</button><span>${pos+1} / ${qs.length}</span><button ${pos===qs.length-1?'disabled':''} onclick="moveGuide('${f.id}',1)">Suivant →</button></div><div class="advice"><b>À garder en tête</b><p>Les réponses ne valident pas à elles seules la légalité d’un acte. Consulte la fiche complète pour la checklist.</p></div>`:`<p>Cette fiche ne comporte pas encore de questions. Utilise le mode fiche complète.</p>`}`}<h3>Références à contrôler</h3><p>${esc(f.refs||'Références spécifiques à compléter et valider')}</p><a href="https://www.legifrance.gouv.fr/codes/id/LEGITEXT000006071154" target="_blank" rel="noopener">Code de procédure pénale sur Légifrance ↗</a><div class="bottomActions"><button onclick="newNote('${f.id}')">＋ Note liée à la fiche</button><button onclick="page='templates';render()">▤ Modèles CR</button></div><p class="muted">Aucune donnée de procédure réelle ou sensible dans cette application publique.</p></div>`}

// V4: module d'orientation documentaire sur les armes; aucune classification automatique.
const weaponTypes=[
['Arme de poing','Pistolet, revolver, arme de poing à blanc, signalisation ou alarme','Le régime dépend du modèle exact, du fonctionnement et des caractéristiques.'],
['Arme longue','Fusil, carabine, arme de chasse ou de tir sportif','Examiner le fonctionnement, le modèle, le calibre et la capacité; vérifier le RGA si applicable.'],
['Arme à air ou gaz comprimé','Carabine à plombs, pistolet à air, CO₂','La puissance et les caractéristiques sont déterminantes; ne pas inférer le régime du seul aspect.'],
['Arme blanche','Couteau, poignard, matraque, sabre','La nature exacte et le classement réglementaire doivent être vérifiés.'],
['Arme neutralisée / ancienne','Arme neutralisée, de collection, reproduction','Vérifier les certificats, la date, le procédé et les textes applicables.'],
['Arme d’alarme / à blanc','Pistolet d’alarme, starter, lanceur de signalisation','Le classement dépend de la conformité, du modèle et des règles en vigueur.'],
['Autre objet ou composant','Élément d’arme, chargeur, munition, accessoire','Certains éléments et munitions relèvent de règles distinctes.']];
const weaponCategories=[['A1','Armes et éléments interdits à l’acquisition et à la détention, sauf exceptions légales.'],['A2','Matériels de guerre et armes relevant de cette catégorie.'],['B','Acquisition et détention soumises à autorisation.'],['C','Acquisition et détention soumises à déclaration.'],['D','Régime d’acquisition et de détention libre pour certains objets, sous réserve des restrictions et exceptions.']];
let armType='',armBrand='',armModel='',armMark='',armCal='',armDoc='';
function armUpdate(field,value){window[field]=value}
function renderArms(){const a=$('app');a.innerHTML=`<div class="card"><div class="muted">Réflexe GN • V4</div><h2>🔎 Identifier une arme</h2><p>Outil d’orientation documentaire pour la découverte d’un objet pouvant être une arme. <b>Aucun classement définitif sans vérification officielle.</b></p><div class="alert"><b>Sécurité :</b> ne pas manipuler, essayer, désassembler ou tester une arme inconnue pour l’identifier. Appliquer les procédures de sécurité et solliciter les personnels compétents.</div><h3>1. Description et inscriptions</h3><label>Famille apparente<select id="armtype" onchange="armType=this.value;armResults()"><option value="">Choisir…</option>${weaponTypes.map(x=>`<option ${armType===x[0]?'selected':''}>${esc(x[0])}</option>`).join('')}</select></label><div class="armgrid"><label>Marque / fabricant<input id="armbrand" placeholder="Ex. marquage observé" value="${esc(armBrand)}" oninput="armBrand=this.value"></label><label>Modèle / référence<input id="armmodel" placeholder="Inscription exacte" value="${esc(armModel)}" oninput="armModel=this.value"></label><label>Calibre / puissance indiqué<input id="armcal" placeholder="Sans manipulation" value="${esc(armCal)}" oninput="armCal=this.value"></label><label>Autres marquages<input id="armmark" placeholder="Inscription, poinçon…" value="${esc(armMark)}" oninput="armMark=this.value"></label></div><label>Notice / documentation connue<textarea id="armdoc" placeholder="Recopier seulement les éléments non sensibles de la notice" oninput="armDoc=this.value">${esc(armDoc)}</textarea></label><button onclick="armResults()">Afficher les pistes de vérification</button><div id="armresults"></div><h3>2. Catégories à vérifier</h3>${weaponCategories.map(x=>`<div class="armres"><b>Catégorie ${x[0]}</b><p>${x[1]}</p></div>`).join('')}<p class="muted">Ces résumés ne remplacent pas les sous-catégories, exceptions et textes réglementaires à jour.</p><h3>3. Sources officielles</h3><p><a href="https://www.service-public.fr/particuliers/vosdroits/N287" target="_blank" rel="noopener">Service-Public — Armes : règles et démarches ↗</a></p><p><a href="https://www.legifrance.gouv.fr/codes/id/LEGITEXT000025503132" target="_blank" rel="noopener">Code de la sécurité intérieure — Légifrance ↗</a></p><p><a href="https://www.service-public.fr/particuliers/vosdroits/F31877" target="_blank" rel="noopener">Service-Public — Classement des armes ↗</a></p><p class="muted">Pour les armes à feu portatives, rechercher également le modèle exact dans le Référentiel général des armes (RGA) du SCAE, par les voies officielles autorisées.</p><h3>4. Fiche découverte / constatations</h3><p>Noter uniquement les observations non sensibles et autorisées : type apparent, inscriptions visibles sans manipulation, emplacement général, documents présentés, mesures de préservation et vérifications restant à faire. Le relevé complet et les éléments de procédure doivent rester dans les outils professionnels autorisés.</p><button onclick="armCopy()">Copier une trame vierge</button><p class="muted">Pas de photographie ou de données de procédure stockées sur ce site public.</p></div>`;armResults()}
function armResults(){const e=$('armresults');if(!e)return;const w=weaponTypes.find(x=>x[0]===armType);e.innerHTML=`<div class="armres"><b>Résultat : orientation, non identification</b>${w?`<p><b>${esc(w[0])}</b> — ${esc(w[1])}</p><p>${esc(w[2])}</p>`:'<p>Choisir une famille apparente pour afficher les vérifications.</p>'}<p><b>À confirmer :</b> correspondance exacte fabricant / modèle / marquages, caractéristiques techniques documentées, éventuel classement RGA et dispositions réglementaires à jour.</p><p class="muted">La marque, la notice et le calibre seuls ne suffisent pas à conclure sur la catégorie.</p></div>`}
function armCopy(){const t='FICHE DÉCOUVERTE D’ARME — TRAME VIERGE\nDate / heure :\nContexte autorisé :\nObjet / famille apparente :\nMarquages visibles sans manipulation :\nDocumentation disponible :\nMesures de sécurité et préservation :\nVérification RGA / textes :\nClassement confirmé par :\nAvis et suites à consigner dans le système professionnel :';navigator.clipboard?.writeText(t).then(()=>alert('Trame copiée')).catch(()=>prompt('Copier la trame :',t))}
const renderPrevious=render;
render=function(){if(page==='armes'){renderArms();return}renderPrevious()};
// Enrichissement ciblé des cinq fiches prioritaires; rappels à valider localement.
const enrich={
'vif':{steps:['Sécuriser les lieux, identifier les risques immédiats et séparer les personnes si nécessaire','Évaluer les blessures et demander les secours adaptés','Identifier victimes, mis en cause, témoins et mineurs présents ou exposés','Recueillir les premières déclarations sans compromettre les auditions ultérieures','Préserver les traces, messages, photographies et autres éléments utiles','Évaluer le risque de réitération et les besoins de protection','Aviser l’OPJ et vérifier le cadre juridique des actes','Organiser les constatations et auditions par personnel habilité','Vérifier les mesures de protection et les orientations adaptées','Tracer les avis, diligences, instructions et suites'],questions:['Secours médicaux immédiats nécessaires ?','Mineurs présents ou concernés ?','Danger actuel ou risque de réitération ?','Des éléments matériels ou numériques doivent-ils être préservés ?','Une mesure de protection doit-elle être examinée ?']},
'deces':{steps:['Sécuriser et préserver les lieux','Vérifier l’intervention des secours et du professionnel habilité pour le constat du décès','Identifier le découvreur et recueillir la chronologie initiale','Noter les éléments objectifs sans préjuger de la cause','Préserver les traces et limiter les accès','Aviser l’OPJ et vérifier le cadre applicable, notamment l’article 74 CPP si pertinent','Vérifier les avis au parquet et instructions reçues','Organiser les constatations par personnels compétents','Tracer les actes, horaires et transmissions'],questions:['Les circonstances paraissent-elles suspectes ou la cause inconnue ?','Les lieux présentent-ils un risque persistant ?','Des témoins ou éléments de chronologie sont-ils identifiés ?','Un cadre spécifique et des avis ont-ils été validés ?']},
'i103':{steps:['Évaluer les dangers et sécuriser les lieux','Vérifier la présence d’occupants ou d’auteurs et les besoins de secours','Préserver les accès et traces, limiter les contaminations','Recueillir chronologie et circonstances de découverte','Identifier les témoins et sources de vidéos disponibles','Constater les accès forcés et dommages observables','Recenser les objets déclarés manquants sans conclure prématurément','Déterminer avec l’OPJ le cadre procédural applicable','Organiser les constatations et recherches de traces par personnels compétents','Tracer les avis, actes, pièces et suites'],questions:['Auteur encore sur place ?','Des personnes nécessitent-elles une assistance ?','Traces exploitables ?','Témoins ou vidéos identifiés ?','Le cadre d’enquête a-t-il été vérifié ?']},
'i112':{steps:['Sécuriser les lieux, prévenir les suraccidents et organiser la protection des personnes','Demander les secours et services compétents','Préserver les lieux et les traces sans compromettre les secours','Identifier les véhicules, conducteurs, victimes et témoins','Recueillir la chronologie initiale et les éléments matériels accessibles','Aviser l’OPJ et les autorités compétentes selon le contexte','Vérifier les cadres juridiques applicables et les actes nécessaires','Organiser les constatations spécialisées et les vérifications autorisées','Tracer les mesures, avis, horaires et transmissions'],questions:['Des secours ou un danger persistant nécessitent-ils une action immédiate ?','Les circonstances ou causes sont-elles incertaines ?','Les témoins et éléments matériels sont-ils préservés ?','Les avis et mesures judiciaires ont-ils été vérifiés ?']},
'gav':{steps:['Vérifier les conditions légales et la nécessité de la mesure','Identifier l’OPJ compétent et les instructions applicables','Fixer et tracer les heures et circonstances exactes','Effectuer les avis et notifications requis dans les délais applicables','Vérifier les droits et demandes d’avocat, médecin, interprète ou tiers selon le cas','Examiner les règles spécifiques aux mineurs et personnes vulnérables','Contrôler les durées et éventuelles prolongations','Tracer auditions, repos, alimentation et incidents','Vérifier les décisions de fin de mesure et les suites','Contrôler la cohérence de la procédure et des avis'],questions:['Conditions légales de la mesure réunies ?','Mineur ou vulnérabilité particulière ?','Demandes de droits ou d’assistance ?','Échéance ou prolongation à contrôler ?']}}
for(const f of seed){const e=enrich[f.id];if(e){f.steps=e.steps;f.questions=e.questions}}
// Fiche découverte également accessible dans le catalogue.
seed.push({id:'armes_v4',type:'Intervention',title:'Arme découverte — identification et préservation',steps:['Évaluer le danger et appliquer les consignes de sécurité sans essai ni manipulation exploratoire','Préserver la situation et solliciter les personnels habilités si nécessaire','Observer les marquages et caractéristiques accessibles sans manipulation','Rechercher une documentation ou notice disponible de manière autorisée','Vérifier fabricant, modèle, caractéristiques et éventuel classement RGA','Contrôler le régime juridique dans les textes à jour et les exceptions','Tracer les avis et les suites dans le système professionnel autorisé'],questions:['L’objet présente-t-il un danger immédiat ?','L’identification exacte du modèle est-elle documentée ?','Le classement réglementaire a-t-il été confirmé par une source compétente ?'],refs:'Code de la sécurité intérieure : art. L311-2 et R311-2, à vérifier dans leur version applicable.'});

render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
