<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142b49"><title>Réflexe GN</title><link rel="manifest" href="manifest.webmanifest"><style>body{margin:0;background:#eef2f7;color:#152b45;font:16px system-ui}header{background:#142b49;color:white;padding:20px}main{max-width:800px;margin:auto;padding:16px}button,input,textarea,select{font:inherit}button{border:1px solid #cbd5e1;border-radius:12px;background:white;padding:12px;cursor:pointer}nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.card{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 5px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.muted{color:#52647b;font-size:13px}textarea,input,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;margin:8px 0}textarea{min-height:150px}label{display:block;padding:9px 0}label input{width:auto}h2{margin-top:0}.active{background:#d8e7f9} .warn{background:#fff3d7;padding:12px;border-radius:10px}</style></head><body><header><strong>🛡️ RÉFLEXE GN</strong><div style="font-size:13px">Fiches de travail personnalisables • hors ligne</div></header><main><div class="warn">Prototype non officiel. Contenus indicatifs à faire valider par les référents compétents. Ne saisir aucune donnée nominative, sensible ou issue d'une procédure réelle sur un hébergement ou appareil non autorisé.</div><nav><button onclick="page='catalogue';render()">Fiches</button><button onclick="page='notes';render()">Mes notes</button><button onclick="page='custom';render()">Mes fiches</button><button onclick="page='settings';render()">Sauvegarde</button></nav><div id="app"></div></main><script>
const seed=[{id:'vif',type:'Intervention',title:'Violences intrafamiliales',steps:['Sécuriser la situation et protéger les personnes','Évaluer le besoin de secours et de protection','Identifier les personnes et les témoins','Préserver les traces et éléments utiles','Aviser l’OPJ et déterminer le cadre procédural','Vérifier les mesures de protection et les suites adaptées'],questions:['Une personne nécessite-t-elle des secours immédiats ?','Des mineurs sont-ils présents ou concernés ?','Existe-t-il un danger actuel ou un risque de réitération ?']},{id:'deces',type:'Intervention',title:'Découverte de cadavre',steps:['Sécuriser et préserver les lieux','Faire intervenir les secours ou professionnels habilités selon la situation','Recueillir les circonstances de découverte','Aviser l’OPJ et déterminer le cadre juridique','Organiser les constatations et avis requis'],questions:['Les circonstances sont-elles suspectes ou inconnues ?','Les lieux ont-ils été préservés ?']},{id:'avp',type:'Intervention',title:'Accident de circulation',steps:['Sécuriser les lieux et protéger les usagers','Déclencher les secours si nécessaire','Identifier les personnes et témoins','Préserver les constatations utiles','Déterminer les suites administratives et judiciaires'],questions:['Y a-t-il des blessés ?','Un danger persiste-t-il pour la circulation ?']},{id:'flag',type:'Procédure',title:'Enquête de flagrance',steps:['Vérifier les conditions légales de flagrance','Identifier l’OPJ responsable et les avis requis','Préserver les indices et identifier les témoins','Vérifier les conditions propres à chaque acte envisagé','Contrôler les délais et tracer les décisions'],questions:['Les critères légaux de flagrance sont-ils réunis ?','L’acte envisagé relève-t-il des prérogatives de l’intervenant ?']},{id:'prelim',type:'Procédure',title:'Enquête préliminaire',steps:['Identifier la saisine et le cadre juridique','Déterminer les actes utiles et leurs conditions','Vérifier consentements ou autorisations nécessaires','Assurer la traçabilité des actes et avis'],questions:['L’acte exige-t-il un accord ou une autorisation ?']},{id:'gav',type:'Procédure',title:'Garde à vue',steps:['Vérifier les conditions légales du placement','Contrôler la compétence et les avis nécessaires','Vérifier notification des droits et délais','Suivre les demandes et diligences requises','Contrôler les échéances et la décision de fin de mesure'],questions:['Les conditions légales de placement sont-elles réunies ?','Des besoins particuliers ou vulnérabilités existent-ils ?']},{id:'art74',type:'Procédure',title:'Article 74 CPP',steps:['Qualifier la situation et le cadre juridique applicable','Préserver les lieux et éléments utiles','Aviser l’OPJ et le parquet selon les règles applicables','Vérifier les habilitations et autorisations pour chaque acte','Tracer les constatations et instructions reçues'],questions:['La cause du décès est-elle inconnue ou suspecte ?']}];
let page='catalogue',current=null,filter='',mode='Tous';const $=id=>document.getElementById(id);const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let notes=load('rgn_notes',[]),custom=load('rgn_custom',[]),checks=load('rgn_checks',{});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let a=$('app'),items=[...seed,...custom];if(page==='catalogue'){a.innerHTML=`<h2>Fiches réflexes</h2><input id="search" placeholder="Rechercher une situation…" value="${esc(filter)}" oninput="filter=this.value;list()"><select onchange="mode=this.value;list()"><option ${mode==='Tous'?'selected':''}>Tous</option><option ${mode==='Intervention'?'selected':''}>Intervention</option><option ${mode==='Procédure'?'selected':''}>Procédure</option></select><div id="results"></div>`;list()}else if(page==='detail'){let f=items.find(x=>x.id===current);if(!f){page='catalogue';render();return}let checked=checks[f.id]||[];a.innerHTML=`<button onclick="page='catalogue';render()">← Retour</button><div class="card"><div class="muted">${esc(f.type)}</div><h2>${esc(f.title)}</h2><p class="muted">Trame indicative, à adapter au contexte et aux textes à jour.</p><h3>Questions à vérifier</h3>${f.questions.map(q=>`<label>◇ ${esc(q)}</label>`).join('')}<h3>Checklist</h3>${f.steps.map((s,i)=>`<label><input type="checkbox" ${checked.includes(i)?'checked':''} onchange="toggle('${f.id}',${i},this.checked)"> ${esc(s)}</label>`).join('')}<button onclick="newNote('${f.id}')">Ajouter une note à cette fiche</button></div>`}else if(page==='notes'){a.innerHTML=`<h2>Mes notes locales</h2><button onclick="newNote('')">+ Nouvelle note</button>${notes.map(n=>`<div class="card"><b>${esc(n.title)}</b><p class="muted">${esc(n.date)} · ${esc(n.fiche||'Note libre')}</p><p style="white-space:pre-wrap">${esc(n.text.slice(0,250))}</p><button onclick="editNote('${n.id}')">Modifier</button> <button onclick="removeNote('${n.id}')">Supprimer</button></div>`).join('')||'<p>Aucune note.</p>'}`}else if(page==='editnote'){let n=notes.find(x=>x.id===current);a.innerHTML=`<h2>${n?'Modifier':'Nouvelle'} note</h2><input id="ntitle" placeholder="Titre" value="${esc(n?.title||'')}"><textarea id="ntext" placeholder="Notes non sensibles uniquement">${esc(n?.text||'')}</textarea><button onclick="storeNote()">Enregistrer</button> <button onclick="page='notes';render()">Annuler</button>`}else if(page==='custom'){a.innerHTML=`<h2>Mes fiches personnalisées</h2><p class="muted">Une étape par ligne. Contenu personnel non validé.</p><input id="ftitle" placeholder="Titre de la fiche"><select id="ftype"><option>Intervention</option><option>Procédure</option></select><textarea id="fsteps" placeholder="Étape 1&#10;Étape 2"></textarea><button onclick="addFiche()">Créer la fiche</button>${custom.map(f=>`<div class="card"><b>${esc(f.title)}</b> <button onclick="current='${f.id}';page='detail';render()">Ouvrir</button> <button onclick="deleteFiche('${f.id}')">Supprimer</button></div>`).join('')}`}else if(page==='settings'){a.innerHTML=`<h2>Sauvegarde</h2><p>Les données restent dans ce navigateur et peuvent disparaître si son stockage est effacé. Exportez-les régulièrement. Aucun compte ni synchronisation.</p><button onclick="exportData()">Exporter mes données (JSON)</button><p>Restaurer une sauvegarde :</p><input type="file" accept=".json,application/json" onchange="importData(this.files[0])"><p class="muted">Ne stockez pas d'informations couvertes par le secret de l'enquête, de données personnelles de victimes ou de mis en cause dans ce prototype.</p>`}}function list(){let r=$('results');if(!r)return;let v=[...seed,...custom].filter(f=>(mode==='Tous'||f.type===mode)&&(f.title+' '+f.steps.join(' ')).toLowerCase().includes(filter.toLowerCase()));r.innerHTML=`<div class="grid">${v.map(f=>`<button style="text-align:left" onclick="current='${f.id}';page='detail';render()"><b>${esc(f.title)}</b><div class="muted">${esc(f.type)} →</div></button>`).join('')}</div>`}function toggle(id,i,on){let c=new Set(checks[id]||[]);on?c.add(i):c.delete(i);checks[id]=[...c];save('rgn_checks',checks)}function newNote(id){current=null;window.noteFiche=([ ...seed,...custom].find(f=>f.id===id)||{}).title||'';page='editnote';render()}function editNote(id){current=id;page='editnote';render()}function storeNote(){let n=notes.find(x=>x.id===current),title=$('ntitle').value.trim(),t=$('ntext').value;if(!title)return alert('Saisir un titre');if(n){n.title=title;n.text=t;n.date=new Date().toLocaleDateString('fr-FR')}else notes.unshift({id:'n'+Date.now(),title,text:t,date:new Date().toLocaleDateString('fr-FR'),fiche:window.noteFiche||''});save('rgn_notes',notes);page='notes';render()}function removeNote(id){if(confirm('Supprimer cette note ?')){notes=notes.filter(x=>x.id!==id);save('rgn_notes',notes);render()}}function addFiche(){let title=$('ftitle').value.trim(),steps=$('fsteps').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!title||!steps.length)return alert('Titre et étapes nécessaires');custom.push({id:'f'+Date.now(),type:$('ftype').value,title,steps,questions:[]});save('rgn_custom',custom);render()}function deleteFiche(id){if(confirm('Supprimer cette fiche ?')){custom=custom.filter(f=>f.id!==id);save('rgn_custom',custom);render()}}function exportData(){let blob=new Blob([JSON.stringify({notes,custom,checks},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='reflexe-gn-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importData(f){if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.notes)||!Array.isArray(d.custom)||!d.checks||typeof d.checks!=='object')throw Error();if(!confirm('Remplacer les données locales par cette sauvegarde ?'))return;notes=d.notes;custom=d.custom;checks=d.checks;save('rgn_notes',notes);save('rgn_custom',custom);save('rgn_checks',checks);render()}catch{alert('Fichier de sauvegarde invalide')}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
