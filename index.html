let page='catalogue',current=null,filter='',mode='Tous';const $=id=>document.getElementById(id);const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let notes=load('rgn_notes',[]),custom=load('rgn_custom',[]),checks=load('rgn_checks',{});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let a=$('app'),items=[...seed,...custom];if(page==='catalogue'){a.innerHTML=`<h2>Fiches réflexes</h2><input id="search" placeholder="Rechercher une situation…" value="${esc(filter)}" oninput="filter=this.value;list()"><select onchange="mode=this.value;list()"><option ${mode==='Tous'?'selected':''}>Tous</option><option ${mode==='Intervention'?'selected':''}>Intervention</option><option ${mode==='Procédure'?'selected':''}>Procédure</option></select><div id="results"></div>`;list()}else if(page==='detail'){let f=items.find(x=>x.id===current);if(!f){page='catalogue';render();return}let checked=checks[f.id]||[];a.innerHTML=`<button onclick="page='catalogue';render()">← Retour</button><div class="card"><div class="muted">${esc(f.type)}</div><h2>${esc(f.title)}</h2><p class="muted">Trame indicative, à adapter au contexte et aux textes à jour.</p><h3>Arbre de décision / vérifications</h3><p class="muted">Répondre à chaque question pour afficher les points d'attention ; ne remplace pas une décision juridique.</p>${f.questions.map((q,i)=>`<div class="decision"><b>${esc(q)}</b><div><button onclick="this.parentNode.nextElementSibling.textContent='OUI : vérifier les règles et avis spécifiques avant de poursuivre.'">Oui</button> <button onclick="this.parentNode.nextElementSibling.textContent='NON : documenter cette réponse et poursuivre les vérifications.'">Non</button> <button onclick="this.parentNode.nextElementSibling.textContent='À déterminer : recueillir les éléments manquants et consulter l’OPJ.'">Inconnu</button></div><p class="muted"></p></div>`).join('')}<h3>Références / recherche juridique</h3><p>${esc(f.refs||'Références à compléter et vérifier')}</p><p><a href="https://www.legifrance.gouv.fr/codes/id/LEGITEXT000006071154" target="_blank" rel="noopener">Consulter le CPP sur Légifrance ↗</a></p><h3>Checklist</h3>${f.steps.map((s,i)=>`<label><input type="checkbox" ${checked.includes(i)?'checked':''} onchange="toggle('${f.id}',${i},this.checked)"> ${esc(s)}</label>`).join('')}<button onclick="newNote('${f.id}')">Ajouter une note à cette fiche</button></div>`}else if(page==='notes'){a.innerHTML=`<h2>Mes notes locales</h2><button onclick="newNote('')">+ Nouvelle note</button>${notes.map(n=>`<div class="card"><b>${esc(n.title)}</b><p class="muted">${esc(n.date)} · ${esc(n.fiche||'Note libre')}</p><p style="white-space:pre-wrap">${esc(n.text.slice(0,250))}</p><button onclick="editNote('${n.id}')">Modifier</button> <button onclick="removeNote('${n.id}')">Supprimer</button></div>`).join('')||'<p>Aucune note.</p>'}`}else if(page==='editnote'){let n=notes.find(x=>x.id===current);a.innerHTML=`<h2>${n?'Modifier':'Nouvelle'} note</h2><input id="ntitle" placeholder="Titre" value="${esc(n?.title||'')}"><textarea id="ntext" placeholder="Notes non sensibles uniquement">${esc(n?.text||'')}</textarea><button onclick="storeNote()">Enregistrer</button> <button onclick="page='notes';render()">Annuler</button>`}else if(page==='custom'){a.innerHTML=`<h2>Mes fiches personnalisées</h2><p class="muted">Une étape par ligne. Contenu personnel non validé.</p><input id="ftitle" placeholder="Titre de la fiche"><select id="ftype"><option>Intervention</option><option>Procédure</option></select><textarea id="fsteps" placeholder="Étape 1&#10;Étape 2"></textarea><button onclick="addFiche()">Créer la fiche</button>${custom.map(f=>`<div class="card"><b>${esc(f.title)}</b> <button onclick="current='${f.id}';page='detail';render()">Ouvrir</button> <button onclick="deleteFiche('${f.id}')">Supprimer</button></div>`).join('')}`}else if(page==='templates'){a.innerHTML=`<h2>Modèles de comptes rendus</h2><p class="muted">Trames génériques, non officielles. Ne pas saisir de données réelles sensibles.</p><select id="tpl" onchange="showTemplate()"><option value="parquet">Compte rendu au magistrat</option><option value="inter">Compte rendu d'intervention</option><option value="gav">Suivi des formalités GAV</option><option value="actes">Synthèse des actes d'enquête</option><option value="deces">Compte rendu découverte de corps</option></select><textarea id="tpltext" style="min-height:350px"></textarea><button onclick="navigator.clipboard.writeText($('tpltext').value).then(()=>alert('Modèle copié')).catch(()=>alert('Copie indisponible'))">Copier</button> <button onclick="window.noteFiche='Modèle CR';current=null;page='editnote';render();$('ntitle').value='Brouillon CR';$('ntext').value=window.lastTemplate||''">Enregistrer en note</button>`;showTemplate()}else if(page==='settings'){a.innerHTML=`<h2>Sauvegarde</h2><p>Les données restent dans ce navigateur et peuvent disparaître si son stockage est effacé. Exportez-les régulièrement. Aucun compte ni synchronisation.</p><button onclick="exportData()">Exporter mes données (JSON)</button><p>Restaurer une sauvegarde :</p><input type="file" accept=".json,application/json" onchange="importData(this.files[0])"><p class="muted">Ne stockez pas d'informations couvertes par le secret de l'enquête, de données personnelles de victimes ou de mis en cause dans ce prototype.</p>`}}const templates={parquet:'COMPTE RENDU AU MAGISTRAT\nDate / heure : [à compléter]\nCadre procédural : [à vérifier]\nSaisine et circonstances :\nFaits rapportés (sources distinguées) :\nConstatations objectives :\nActes déjà réalisés :\nMesures de protection / urgence :\nÉléments restant à vérifier :\nDécision ou instruction sollicitée :\nInstructions reçues / heure :',inter:'COMPTE RENDU D’INTERVENTION\nHeure d’appel et arrivée :\nMotif de l’engagement :\nSituation à l’arrivée :\nMesures de sécurité et secours :\nPersonnes présentes (sans données sensibles dans cette application) :\nConstatations :\nAvis et instructions :\nSuites :',gav:'SUIVI GAV — AIDE-MÉMOIRE NON OFFICIEL\nFondement et objectifs :\nHeure de début :\nDécision OPJ :\nNotification droits :\nAvis parquet :\nDemandes avocat / médecin / proche / interprète :\nActes :\nÉchéances et décisions :\nFin de mesure :',actes:'SYNTHÈSE D’ENQUÊTE\nSaisine :\nQualification provisoire :\nCadre juridique :\nChronologie :\nAuditions :\nConstatations :\nRéquisitions / résultats :\nSaisies / scellés :\nÉléments à charge / à décharge :\nActes à envisager :\nAvis parquet :',deces:'COMPTE RENDU DÉCOUVERTE DE CORPS\nSaisine / heure :\nLieu et circonstances rapportées :\nProfessionnels de secours / constat médical :\nConstatations objectives sans conclusion médico-légale :\nÉléments connus / inconnus :\nPréservation des lieux :\nAvis OPJ / parquet :\nInstructions et actes envisagés :'};function showTemplate(){let e=$('tpl');if(!e)return;window.lastTemplate=templates[e.value];$('tpltext').value=window.lastTemplate}function list(){let r=$('results');if(!r)return;let v=[...seed,...custom].filter(f=>(mode==='Tous'||f.type===mode)&&(f.title+' '+f.steps.join(' ')).toLowerCase().includes(filter.toLowerCase()));r.innerHTML=`<div class="grid">${v.map(f=>`<button style="text-align:left" onclick="current='${f.id}';page='detail';render()"><b>${esc(f.title)}</b><div class="muted">${esc(f.type)} →</div></button>`).join('')}</div>`}function toggle(id,i,on){let c=new Set(checks[id]||[]);on?c.add(i):c.delete(i);checks[id]=[...c];save('rgn_checks',checks)}function newNote(id){current=null;window.noteFiche=([ ...seed,...custom].find(f=>f.id===id)||{}).title||'';page='editnote';render()}function editNote(id){current=id;page='editnote';render()}function storeNote(){let n=notes.find(x=>x.id===current),title=$('ntitle').value.trim(),t=$('ntext').value;if(!title)return alert('Saisir un titre');if(n){n.title=title;n.text=t;n.date=new Date().toLocaleDateString('fr-FR')}else notes.unshift({id:'n'+Date.now(),title,text:t,date:new Date().toLocaleDateString('fr-FR'),fiche:window.noteFiche||''});save('rgn_notes',notes);page='notes';render()}function removeNote(id){if(confirm('Supprimer cette note ?')){notes=notes.filter(x=>x.id!==id);save('rgn_notes',notes);render()}}function addFiche(){let title=$('ftitle').value.trim(),steps=$('fsteps').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!title||!steps.length)return alert('Titre et étapes nécessaires');custom.push({id:'f'+Date.now(),type:$('ftype').value,title,steps,questions:[]});save('rgn_custom',custom);render()}function deleteFiche(id){if(confirm('Supprimer cette fiche ?')){custom=custom.filter(f=>f.id!==id);save('rgn_custom',custom);render()}}function exportData(){let blob=new Blob([JSON.stringify({notes,custom,checks},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='reflexe-gn-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importData(f){if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.notes)||!Array.isArray(d.custom)||!d.checks||typeof d.checks!=='object')throw Error();if(!confirm('Remplacer les données locales par cette sauvegarde ?'))return;notes=d.notes;custom=d.custom;checks=d.checks;save('rgn_notes',notes);save('rgn_custom',custom);save('rgn_checks',checks);render()}catch{alert('Fichier de sauvegarde invalide')}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
